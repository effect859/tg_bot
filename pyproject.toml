[project]
name = "tg-bot"
version = "0.1.0"
description = "Telegram-бот для генерации студенческих документов"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "pydantic-settings>=2.4,<3",
    "redis>=5.0,<7",
    # Разбор недоверенных PDF и DOCX (только в дочернем процессе извлечения). Версии
    # закреплены точно: классификация ошибок libxml2 и поведение PDFium проверены на
    # них; обновление — с повторным прогоном тестов извлечения в Linux-контейнере.
    "pypdfium2==5.13.0",
    "lxml==6.1.3",
    # Официальный SDK Anthropic: анализ материалов (структурированный ответ).
    "anthropic>=1.11,<2",
    # DOCX готового отчёта (Stage 3.2): запись собственного текста, а не разбор чужих
    # файлов — поэтому не в дочернем процессе извлечения. Использует уже закреплённый lxml.
    "python-docx>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.6",
]

[project.scripts]
tg-bot = "app.main_bot:run"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
# Каталог alembic/ с миграциями в корне сбивает автоопределение: это сторонний пакет.
known-third-party = ["alembic"]
known-first-party = ["app"]
